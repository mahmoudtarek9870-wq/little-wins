kind = "mobile"
previewPath = "/little-wins-mobile/"
title = "Little Wins Mobile"
description = "A native Android companion for Little Wins, a personal gamified task planner that turns daily progress into satisfying momentum with tasks, XP, streaks, challenges, and focus tools."
version = "1.0.0"
id = "artifacts/little-wins-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/little-wins-mobile/" ]
localPort = 20460

[services.development]
run = "pnpm --filter @workspace/little-wins-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-wins-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/little-wins-mobile", "run", "serve" ]

[services.env]
PORT = "20460"
BASE_PATH = "/little-wins-mobile/"
